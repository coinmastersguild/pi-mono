<main><header><h1>PIONEER / TRAIL INTRO</h1><small>3D TERMINAL STUDY · 01</small></header>

<script>(() => {

    "..#...##",
    "..#####.",
    "..#...##",
    "..#...##",
    ".######.",
    "..#.#..."

          plot(x - 1, y, 5268616);
          plot(x + 1, y, 5268616);
          plot(x, y - 1, 5268616);
          plot(x, y + 1, 5268616);

        const rayX = sin + cos * side, rayZ = cos - sin * side;
        let bottom = height;
        for (let distance = 1; distance < 370 && bottom > 0; distance += 0.55 + distance * 0.018) {
          const x = camera.x + rayX * distance, z = camera.z + rayZ * distance;
          const terrain = this.heightAt(x, z);
          const top = Math.max(0, Math.floor(horizon + (camera.y - terrain) * projection / distance));
          if (top >= bottom) continue;
          let color;
          if (lakeDistance(x, z) < 1 && terrain < 1) {
            const ripple = Math.sin(z * 2.8 + seconds * 2.1 + Math.sin(x * 0.4)) * 0.5 + 0.5;
            const reflection = Math.max(0, Math.sin(x * 0.09 + z * 0.045)) * 0.55;
            color = mix(21108, 3071999, ripple * 0.45 + reflection);
          } else if (z < 165 && Math.abs(x - pioneerTrailX(z)) < 1.8) {
            color = mix(8477493, 12684364, 0.5 + 0.3 * Math.sin(z * 1.4));
          } else {
            const slope = (this.heightAt(x - 1, z + 1) - terrain) * 0.15;
            const light = Math.max(0.15, Math.min(0.95, 0.48 + slope));
            const snow = terrain > 29 + Math.sin(x * 0.22 + z * 0.09) * 4;
            color = snow ? mix(6519185, 15199731, light) : mix(1581622, 6780295, light);
          }
          color = mix(color, 2505041, Math.min(0.55, distance / 650));
          for (let y = top; y < bottom; y++) {
            pixels[y * width + column] = color;
            depth[y * width + column] = distance;
          }
          bottom = top;
        }
      }
      for (const tree of this.trees) {
        const base = project(tree);
        if (!base || base.d > 180) continue;
        const size2 = Math.max(1, base.scale * (3.5 + hash(tree.x) * 2));
        const color = mix(463906, 2438216, base.d / 260);
        for (let y = 0; y < size2; y++) {
          const halfWidth = y / size2 * size2 * 0.3;
          for (let x = -halfWidth; x <= halfWidth; x++) plot(base.x + x, base.y - size2 + y, color, base.d);
        }
      }
      const hikerZ = -14, hikerX = pioneerTrailX(hikerZ) - 4;
      for (let row = 0; row < HIKER.length; row++) {
        for (let col = 0; col < HIKER[row].length; col++) {
          const cell = HIKER[row][col];
          if (cell === ".") continue;
          const p = project({
            x: hikerX + (col - 4) * 0.35,
            y: this.heightAt(hikerX, hikerZ) + (9 - row) * 0.48,
            z: hikerZ
          });
          if (!p) continue;
          for (let y = 0; y < Math.max(1, p.scale * 0.5); y++) {
            for (let x = 0; x < Math.max(1, p.scale * 0.4); x++)

        for (let row = 0; row < BITCOIN.length; row++) {
          for (let col = 0; col < BITCOIN[row].length; col++) {

              x: coin.x + (col - 4) * 3 + layer * 0.7,
              y: coin.y + (4 - row) * 3 - layer * 0.3,
              z: coin.z + layer

        }
      }
      for (let i = 0; i < 5; i++) {

        if (!p || sparkle < 0.1) continue;
        plot(p.x, p.y, mix(13732912, 16777215, sparkle), p.d);

            [-1, 0],
            [1, 0],
            [0, -1],
            [0, 1]

  };

  var canvas = document.querySelector("canvas");
  var ctx = canvas.getContext("2d");

  var rasterCtx = raster.getContext("2d");

  var play = document.querySelector("#play");
  var mode = document.querySelector("#mode");
  var size = document.querySelector("#size");

  var running = true;

    const [width, rows] = size.value.split("x").map(Number);
    const frame = scene.render(width, rows - 8, elapsed);
    canvas.width = width * 8;
    canvas.height = frame.height * 8;
    if (mode.value === "pixel") {
      raster.width = width;
      raster.height = frame.height;
      const data = rasterCtx.createImageData(width, frame.height);
